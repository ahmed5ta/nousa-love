<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى نوسة الحبيبة ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cairo', 'Tahoma', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
            z-index: 10;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            color: #ff6b81;
            text-shadow: 0 0 10px rgba(255, 107, 129, 0.5);
        }

        .name {
            font-size: 2.5rem;
            color: #ff4757;
            margin-bottom: 30px;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .music-btn {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: 0.3s;
        }

        .music-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(255, 71, 87, 0.6);
        }

        /* القلوب المتطايرة في الخلفية */
        .heart {
            position: absolute;
            color: rgba(255, 107, 129, 0.3);
            font-size: 20px;
            animation: fly 6s linear infinite;
            bottom: -10px;
            z-index: 1;
        }

        @keyframes fly {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>أنت أول حبيب.. وأنت آخر حبيب</h1>
        <div class="name">❤️ نوسة ❤️</div>
        
        <!-- تشغيل الأغنية من نفس المجلد -->
        <audio id="loveSong" loop>
            <source src="baad-el-leil.mp3" type="audio/mp3">
            متصفحك لا يدعم تشغيل الصوت.
        </audio>

        <button class="music-btn" id="playBtn" onclick="toggleMusic()">تشغيل الأغنية 🎵</button>
    </div>

    <script>
        function toggleMusic() {
            var song = document.getElementById("loveSong");
            var btn = document.getElementById("playBtn");
            
            if (song.paused) {
                song.play();
                btn.innerHTML = "إيقاف الأغنية ⏸️";
            } else {
                song.pause();
                btn.innerHTML = "تشغيل الأغنية 🎵";
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        setInterval(createHeart, 400);
    </script>

</body>
</html>
